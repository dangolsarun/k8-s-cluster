---
# Cross-OS Bootstrap 'dictator' User (Ubuntu, Debian, Rocky, AlmaLinux, RHEL, CentOS, SUSE)
- name: Bootstrap 'dictator' User
  hosts: all
  become: true
  vars:
    target_user: dictator
  
  tasks:
    - name: Set OS-specific admin group fact
      ansible.builtin.set_fact:
        admin_groups: "{{ 'sudo,adm' if ansible_os_family == 'Debian' else 'wheel' }}"

    - name: Ensure target user exists with proper OS admin group
      ansible.builtin.user:
        name: "{{ target_user }}"
        shell: /bin/bash
        groups: "{{ admin_groups }}"
        append: true
        state: present
      ignore_errors: true

    - name: Configure Passwordless Sudo for {{ target_user }}
      ansible.builtin.copy:
        content: "{{ target_user }} ALL=(ALL) NOPASSWD: ALL"
        dest: "/etc/sudoers.d/{{ target_user }}"
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Set up authorized keys for {{ target_user }}
      ansible.posix.authorized_key:
        user: "{{ target_user }}"
        state: present
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
      ignore_errors: true
