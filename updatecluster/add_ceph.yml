---
# Playbook: Add Ceph Agent Node
# Usage: ansible-playbook -i inventory.ini updatecluster/add_ceph.yml --limit <new_ceph_hostname>

- name: Phase 0 - Bootstrap User (Dictator & SSH Key)
  hosts: ceph_agents
  become: true
  tags: bootstrap
  vars:
    target_user: dictator
  tasks:
    - name: Set OS-specific admin group fact
      ansible.builtin.set_fact:
        admin_groups: "{{ 'sudo,adm' if ansible_os_family == 'Debian' else 'wheel' }}"

    - name: Ensure target user exists
      ansible.builtin.user:
        name: "{{ target_user }}"
        shell: /bin/bash
        groups: "{{ admin_groups }}"
        append: true
        state: present
      ignore_errors: true

    - name: Configure Passwordless Sudo for {{ target_user }}
      ansible.builtin.copy:
        content: "{{ target_user }} ALL=(ALL) NOPASSWD: ALL"
        dest: "/etc/sudoers.d/{{ target_user }}"
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Set up authorized keys for {{ target_user }}
      ansible.posix.authorized_key:
        user: "{{ target_user }}"
        state: present
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
      ignore_errors: true

- name: Phase 1 - Prepare New Ceph Node
  hosts: ceph_agents
  become: true
  tags: common
  roles:
    - common

- name: Phase 2 - Join New Ceph Node to Cluster
  hosts: ceph_agents
  become: true
  tags: join_ceph
  roles:
    - rke2_agent

- name: Phase 3 - Verify Ceph Node Status and Storage Discovery
  hosts: rke2_servers[0]
  become: true
  tasks:
    - name: Check Ceph nodes readiness in Kubernetes
      ansible.builtin.shell: /var/lib/rancher/rke2/bin/kubectl get nodes -l node-role.kubernetes.io/ceph=true -o wide
      register: ceph_nodes_out
      environment:
        KUBECONFIG: /etc/rancher/rke2/rke2.yaml

    - name: Display Ceph nodes status
      ansible.builtin.debug:
        msg: "{{ ceph_nodes_out.stdout_lines }}"
