---
# Playbook: Remove Ceph Agent Node
# Usage: ansible-playbook -i inventory.ini updatecluster/remove_ceph.yml --limit <ceph_hostname_to_remove>

- name: Drain and Delete Ceph Node from Cluster
  hosts: ceph_agents
  become: true
  tasks:
    - name: Drain target Ceph node
      ansible.builtin.shell: |
        /var/lib/rancher/rke2/bin/kubectl drain {{ inventory_hostname }} \
          --ignore-daemonsets \
          --delete-emptydir-data \
          --force \
          --grace-period=60
      delegate_to: "{{ groups['rke2_servers'][0] }}"
      environment:
        KUBECONFIG: /etc/rancher/rke2/rke2.yaml
      ignore_errors: true

    - name: Delete Ceph node from Kubernetes
      ansible.builtin.shell: |
        /var/lib/rancher/rke2/bin/kubectl delete node {{ inventory_hostname }} --ignore-not-found=true
      delegate_to: "{{ groups['rke2_servers'][0] }}"
      environment:
        KUBECONFIG: /etc/rancher/rke2/rke2.yaml
      ignore_errors: true

- name: Purge RKE2 and Rook Ceph State on Target Host
  hosts: ceph_agents
  become: true
  tasks:
    - name: Stop RKE2 Agent service
      ansible.builtin.service:
        name: rke2-agent
        state: stopped
        enabled: false
      ignore_errors: true

    - name: Execute RKE2 Killall script
      ansible.builtin.shell: /usr/local/bin/rke2-killall.sh
      args:
        removes: /usr/local/bin/rke2-killall.sh
      ignore_errors: true

    - name: Execute RKE2 Uninstall script
      ansible.builtin.shell: /usr/local/bin/rke2-uninstall.sh
      args:
        removes: /usr/local/bin/rke2-uninstall.sh
      ignore_errors: true

    - name: Wipe Rook Ceph data directory and RKE2 paths
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/rook
        - /etc/rancher/rke2
        - /var/lib/rancher/rke2
        - /var/lib/kubelet
        - /var/lib/cni
        - /etc/kubernetes

    - name: Remove device mapper Ceph entries
      ansible.builtin.shell: |
        ls /dev/mapper/ 2>/dev/null | grep -i ceph | while read dev; do
          dmsetup remove --force /dev/mapper/$dev 2>/dev/null || true
        done
      ignore_errors: true

    - name: Detect OS disk automatically
      ansible.builtin.shell: |
        ROOT_DEV=$(findmnt -n -o SOURCE /)
        if echo "$ROOT_DEV" | grep -qE "mapper|lvm"; then
          ROOT_DEV=$(pvs --noheadings -o pv_name 2>/dev/null | head -1 | tr -d ' ')
        fi
        BASE=$(lsblk -no pkname "$ROOT_DEV" 2>/dev/null | head -1)
        if [ -z "$BASE" ]; then
          BASE=$(echo "$ROOT_DEV" | sed 's/[0-9]*$//' | xargs basename)
        fi
        echo "$BASE"
      register: os_disk
      changed_when: false
      ignore_errors: true

    - name: Get all data disks excluding OS disk
      ansible.builtin.shell: |
        OS_DISK="{{ os_disk.stdout | trim }}"
        lsblk -d -o NAME,TYPE --noheadings | \
          awk '$2=="disk" {print $1}' | \
          grep -v "^nbd" | \
          grep -v "^sr" | \
          grep -v "^loop" | \
          grep -v "^${OS_DISK}$"
      register: data_disks
      changed_when: false
      ignore_errors: true

    - name: Wipe all target host data disks
      ansible.builtin.shell: |
        DISK="/dev/{{ item }}"
        wipefs -af $DISK
        sgdisk --zap-all $DISK
        dd if=/dev/zero of=$DISK bs=1M count=100 conv=fsync
      loop: "{{ data_disks.stdout_lines | default([]) }}"
      ignore_errors: true

