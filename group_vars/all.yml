---
# RKE2 Version (Consult https://github.com/rancher/rke2/releases for latest)
rke2_version: "v1.28.10+rke2r1"

# Cluster VIP for HA
# REPLACE THIS with the actual Virtual IP you want to use for the cluster endpoint
cluster_vip: "192.168.28.129"
cluster_domain: "k8s.dishhome.com.np"

# Networking
rke2_cni: "cilium" # Options: canal (default), cilium, calico
cilium_version: "1.15.5"

# RKE2 Config
# RKE2 Config
rke2_config_dir: "/etc/rancher/rke2"
# Generates a token and saves it to 'credentials/node-token' locally if it doesn't exist
rke2_token: "{{ lookup('password', 'credentials/node-token length=32 chars=ascii_letters,digits') }}" 

# OS Settings
disable_firewalld: true
enable_iscsi: true

# TLS & Certificate Management
tls_secret_name: "dishhome-wildcard-tls"
tls_namespaces:
  - "rook-ceph"
  - "default"
  - "kube-system"
  - "ingress-internal"
  - "ingress-external"
  - "monitoring"
  - "devops-harbor"
  - "devops-argocd"

# DevOps Platform Configuration (Harbor & Argo CD)
# External GitLab & Dedicated VM Runner: https://git.dishhome.com.np
harbor_domain: "harbor.dishhome.com.np"
harbor_namespace: "devops-harbor"
harbor_chart_version: "1.14.0"
harbor_storage_class: "ceph-block"
harbor_admin_password: "DishHomeAdmin123!" # Change after deployment

argocd_domain: "argocd.dishhome.com.np"
argocd_namespace: "devops-argocd"
argocd_chart_version: "6.7.1"
argocd_storage_class: "ceph-block"

gitlab_url: "https://git.dishhome.com.np"

ingress_internal_class: "nginx-internal"

