---
- name: Ensure temp directory exists for devops configs
  ansible.builtin.file:
    path: /tmp/devops
    state: directory
    mode: '0755'

- name: Add Helm Repositories for Harbor, Argo CD, and GitLab Runner
  ansible.builtin.shell: |
    helm repo add goharbor https://helm.goharbor.io
    helm repo add argo https://argoproj.github.io/argo-helm
    helm repo add gitlab https://charts.gitlab.io
    helm repo update
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
    PATH: "/usr/local/bin:{{ ansible_env.PATH }}"
  run_once: true

- name: Create Namespaces for DevOps Platform
  ansible.builtin.shell: |
    /var/lib/rancher/rke2/bin/kubectl create namespace {{ item }} --dry-run=client -o yaml | /var/lib/rancher/rke2/bin/kubectl apply -f -
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
  loop:
    - "{{ harbor_namespace }}"
    - "{{ argocd_namespace }}"
    - "{{ gitlab_runner_namespace }}"
  run_once: true

- name: Render Harbor Helm values
  ansible.builtin.template:
    src: harbor-values.yaml.j2
    dest: /tmp/devops/harbor-values.yaml
    mode: '0644'
  run_once: true

- name: Deploy Harbor Enterprise Container Registry
  ansible.builtin.shell: |
    helm upgrade --install harbor goharbor/harbor \
      --namespace {{ harbor_namespace }} \
      --version {{ harbor_chart_version }} \
      -f /tmp/devops/harbor-values.yaml \
      --wait \
      --timeout 600s
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
    PATH: "/usr/local/bin:{{ ansible_env.PATH }}"
  run_once: true

- name: Render Argo CD Helm values
  ansible.builtin.template:
    src: argocd-values.yaml.j2
    dest: /tmp/devops/argocd-values.yaml
    mode: '0644'
  run_once: true

- name: Deploy Argo CD GitOps Engine
  ansible.builtin.shell: |
    helm upgrade --install argocd argo/argo-cd \
      --namespace {{ argocd_namespace }} \
      --version {{ argocd_chart_version }} \
      -f /tmp/devops/argocd-values.yaml \
      --wait \
      --timeout 600s
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
    PATH: "/usr/local/bin:{{ ansible_env.PATH }}"
  run_once: true

- name: Render GitLab Runner Helm values
  ansible.builtin.template:
    src: gitlab-runner-values.yaml.j2
    dest: /tmp/devops/gitlab-runner-values.yaml
    mode: '0644'
  run_once: true

- name: Deploy GitLab Runner (if token is configured)
  ansible.builtin.shell: |
    helm upgrade --install gitlab-runner gitlab/gitlab-runner \
      --namespace {{ gitlab_runner_namespace }} \
      --version {{ gitlab_runner_chart_version }} \
      -f /tmp/devops/gitlab-runner-values.yaml \
      --wait \
      --timeout 300s
  environment:
    KUBECONFIG: /etc/rancher/rke2/rke2.yaml
    PATH: "/usr/local/bin:{{ ansible_env.PATH }}"
  when: gitlab_runner_token != "CHANGE_ME_GITLAB_RUNNER_TOKEN" and gitlab_runner_token != ""
  run_once: true

- name: Print DevOps Platform Deployment Summary
  ansible.builtin.debug:
    msg:
      - "=================================================================="
      - "DEVOPS PLATFORM DEPLOYMENT COMPLETE"
      - "=================================================================="
      - "Harbor Registry:   https://{{ harbor_domain }} (Internal Ingress 192.168.28.125)"
      - "  Admin Username:  admin"
      - "  Admin Password:  {{ harbor_admin_password }}"
      - "------------------------------------------------------------------"
      - "Argo CD GitOps:    https://{{ argocd_domain }} (Internal Ingress 192.168.28.125)"
      - "  Admin Username:  admin"
      - "  Get Password:    kubectl -n {{ argocd_namespace }} get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d"
      - "------------------------------------------------------------------"
      - "GitLab Runner:     Namespace '{{ gitlab_runner_namespace }}' (Connected to {{ gitlab_url }})"
      - "=================================================================="
  run_once: true
